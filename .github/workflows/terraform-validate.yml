name: Terraform validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/terraform-validate.yml'
      - 'infra/terraform/**'
  pull_request:
    paths:
      - '.github/workflows/terraform-validate.yml'
      - 'infra/terraform/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read pinned Terraform version
        id: terraform-version
        shell: bash
        run: echo "version=$(<infra/terraform/.terraform-version)" >> "$GITHUB_OUTPUT"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.terraform-version.outputs.version }}
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize without a backend
        working-directory: infra/terraform/cloudflare/staging
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        working-directory: infra/terraform/cloudflare/staging
        run: terraform validate -no-color
