rule_files:
  - ../../platform/observability/rules/tokenplace-production.yaml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x5 1x2'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x8'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 5m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts:
          - exp_labels: {app: tokenplace, application: tokenplace, environment: prod, cluster: sugarkube-prod, namespace: tokenplace, release: tokenplace, severity: critical}
            exp_annotations:
              summary: token.place production has no healthy compute nodes
              description: The relay has explicitly reported zero lease-healthy production compute nodes for five minutes while its instrumentation and Prometheus scrape remain healthy.
              remediation: Acknowledge the incident, restore and register the production compute node, then verify lease health and alert resolution.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/k3s-tokenplace-prod.md#production-compute-capacity-alerts
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '2x7'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x7'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x7'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x7'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="wrong",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x7'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="staging",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x7'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="wrong",namespace="tokenplace",release="tokenplace"}'
        values: '0x7'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="wrong",release="tokenplace"}'
        values: '0x7'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="wrong"}'
        values: '0x7'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x7'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_ready{namespace="tokenplace",container="relay",cluster="sugarkube-prod",pod="tokenplace-1"}'
        values: '1x13'
      - series: 'kube_pod_status_phase{namespace="tokenplace",phase="Running",cluster="sugarkube-prod",pod="tokenplace-1"}'
        values: '1x13'
    alert_rule_test:
      - eval_time: 10m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts:
          - exp_labels: {application: tokenplace, environment: prod, cluster: sugarkube-prod, severity: critical, namespace: tokenplace, container: relay, pod: tokenplace-1, instance: unknown}
            exp_annotations:
              summary: Prometheus has no healthy token.place production metrics target
              description: The expected production relay is running but its authenticated metrics target is down or missing; this does not prove compute capacity is zero.
              remediation: Check ServiceMonitor discovery, the metrics Secret contract, authentication, and network reachability before diagnosing compute capacity.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/k3s-tokenplace-prod.md#production-compute-capacity-alerts
  - interval: 1m
    input_series:
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10 1x2'
    alert_rule_test:
      - eval_time: 10m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts:
          - exp_labels: {app: tokenplace, application: tokenplace, environment: prod, cluster: sugarkube-prod, namespace: tokenplace, release: tokenplace, severity: critical}
            exp_annotations:
              summary: Prometheus has no healthy token.place production metrics target
              description: The expected production relay is running but its authenticated metrics target is down or missing; this does not prove compute capacity is zero.
              remediation: Check ServiceMonitor discovery, the metrics Secret contract, authentication, and network reachability before diagnosing compute capacity.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/k3s-tokenplace-prod.md#production-compute-capacity-alerts
      - eval_time: 11m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts: []
