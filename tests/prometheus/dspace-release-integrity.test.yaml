        application: dspace
        environment: staging
        cluster: sugarkube-int
        severity: critical
        expected_revision: 018687f5a7f4de45508c6e36eb28afb3e44da24d
        state: executed_failure
      exp_annotations:
        summary: DSPACE isolated /chat synthetic failed, is stale, or is missing
        description: A zero success value is an executed failure; timestamp age or absence is a fail-closed producer failure.
        current_revision: unknown
        remediation: Inspect producer freshness first, then verify public /chat and the configured provider without exposing keys.
        runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacechatsyntheticfailed
