  - series: kube_pod_status_phase{namespace="dspace",pod="new",phase="Running"}
    values: 1x20
  - series: dspace_build_info{namespace="dspace",pod="unready",environment="staging",revision="ffffffffffffffffffffffffffffffffffffffff"}
    values: 1x20
  - series: kube_pod_container_status_ready{namespace="dspace",pod="unready",container="dspace"}
    values: '0x20'
  - series: kube_pod_status_phase{namespace="dspace",pod="unready",phase="Running"}
    values: 1x20
  - series: dspace_build_info{namespace="dspace",pod="terminating",environment="staging",revision="ffffffffffffffffffffffffffffffffffffffff"}
    values: 1x20
  - series: kube_pod_container_status_ready{namespace="dspace",pod="terminating",container="dspace"}
    values: 1x20
  - series: kube_pod_status_phase{namespace="dspace",pod="terminating",phase="Running"}
    values: 1x20
  - series: kube_pod_deletion_timestamp{namespace="dspace",pod="terminating"}
    values: 1x20
  - series: dspace_build_info{namespace="dspace",pod="failed",environment="staging",revision="ffffffffffffffffffffffffffffffffffffffff"}
    values: 1x20
  - series: kube_pod_container_status_ready{namespace="dspace",pod="failed",container="dspace"}
    values: 1x20
  - series: kube_pod_status_phase{namespace="dspace",pod="failed",phase="Failed"}
    values: 1x20
  alert_rule_test:
  - eval_time: 11m
    alertname: DspaceBuildRevisionMismatch
    exp_alerts: []
  - eval_time: 11m
    alertname: DspaceMixedBuildRevisions
    exp_alerts: []
