rule_files:
- ../../platform/observability/rules/dspace-release-integrity.yaml
evaluation_interval: 1m
tests:
- name: approved_serving_revision_no_release_alerts
  interval: 1m
  input_series:
  - series: dspace_build_info{namespace="dspace",pod="new",environment="staging",revision="018687f5a7f4de45508c6e36eb28afb3e44da24d"}
    values: 1x20
  - series: kube_pod_container_status_ready{namespace="dspace",pod="new",container="dspace"}
    values: 1x20
  - series: kube_pod_status_phase{namespace="dspace",pod="new",phase="Running"}
    values: 1x20
  alert_rule_test:
  - eval_time: 11m
    alertname: DspaceBuildRevisionMismatch
    exp_alerts: []
  - eval_time: 11m
    alertname: DspaceMixedBuildRevisions
    exp_alerts: []
- name: wrong_runtime_identity
  interval: 1m
  input_series:
  - series: dspace_build_info{namespace="dspace",pod="bad",environment="staging",revision="ffffffffffffffffffffffffffffffffffffffff"}
    values: 1x20
  - series: kube_pod_container_status_ready{namespace="dspace",pod="bad",container="dspace"}
    values: 1x20
  - series: kube_pod_status_phase{namespace="dspace",pod="bad",phase="Running"}
    values: 1x20
  alert_rule_test:
  - eval_time: 11m
    alertname: DspaceBuildRevisionMismatch
    exp_alerts:
    - exp_labels:
        application: dspace
        environment: staging
        cluster: sugarkube-int
        severity: critical
        expected_revision: 018687f5a7f4de45508c6e36eb28afb3e44da24d
        revision: ffffffffffffffffffffffffffffffffffffffff
      exp_annotations:
        summary: DSPACE runtime revision differs from the approved release
        description: Runtime revision ffffffffffffffffffffffffffffffffffffffff is not approved; reconcile the immutable release coordinates.
        current_revision: ffffffffffffffffffffffffffffffffffffffff
        remediation: Roll back or redeploy the finalized evidence coordinates, then verify every pod identity.
        runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacebuildrevisionmismatch
- name: missing_runtime_identity
  interval: 1m
  input_series:
  - series: kube_pod_container_status_ready{namespace="dspace",pod="missing",container="dspace"}
    values: 1x20
  - series: kube_pod_status_phase{namespace="dspace",pod="missing",phase="Running"}
    values: 1x20
  alert_rule_test:
  - eval_time: 11m
    alertname: DspaceBuildRevisionMismatch
    exp_alerts:
    - exp_labels:
        application: dspace
        environment: staging
        cluster: sugarkube-int
        severity: critical
        expected_revision: 018687f5a7f4de45508c6e36eb28afb3e44da24d
        revision: unknown
      exp_annotations:
        summary: DSPACE runtime revision differs from the approved release
        description: Runtime revision unknown is not approved; reconcile the immutable release coordinates.
        current_revision: unknown
        remediation: Roll back or redeploy the finalized evidence coordinates, then verify every pod identity.
        runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacebuildrevisionmismatch
- name: two_active_serving_revisions
  interval: 1m
  input_series:
  - series: dspace_build_info{namespace="dspace",pod="one",environment="staging",revision="018687f5a7f4de45508c6e36eb28afb3e44da24d"}
    values: 1x20
  - series: kube_pod_container_status_ready{namespace="dspace",pod="one",container="dspace"}
    values: 1x20
  - series: kube_pod_status_phase{namespace="dspace",pod="one",phase="Running"}
    values: 1x20
  - series: dspace_build_info{namespace="dspace",pod="two",environment="staging",revision="ffffffffffffffffffffffffffffffffffffffff"}
    values: 1x20
  - series: kube_pod_container_status_ready{namespace="dspace",pod="two",container="dspace"}
    values: 1x20
  - series: kube_pod_status_phase{namespace="dspace",pod="two",phase="Running"}
    values: 1x20
  alert_rule_test:
  - eval_time: 11m
    alertname: DspaceMixedBuildRevisions
    exp_alerts:
    - exp_labels:
        application: dspace
        environment: staging
        cluster: sugarkube-int
        severity: critical
        expected_revision: 018687f5a7f4de45508c6e36eb28afb3e44da24d
      exp_annotations:
        summary: DSPACE replicas report mixed build revisions
        description: More than one active revision persisted beyond the rollout settling window.
        current_revision: multiple
        remediation: Pause the rollout; inspect ReplicaSets and converge all ready pods on the approved revision.
        runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacemixedbuildrevisions
- name: non_serving_historical_revisions_are_ignored
