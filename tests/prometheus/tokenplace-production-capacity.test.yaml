rule_files:
  - ../../platform/observability/rules/tokenplace-production-capacity.yaml
evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace",pod="tokenplace-0"}'
        values: '1x10'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 4m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
      - eval_time: 5m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts:
          - exp_labels: {app: tokenplace, application: tokenplace, environment: prod, cluster: sugarkube-prod, namespace: tokenplace, release: tokenplace, severity: critical}
            exp_annotations:
              summary: token.place production has no healthy compute nodes
              description: The relay has explicitly reported zero lease-healthy compute nodes while its metrics target and instrumentation are healthy.
              remediation: Restore or re-register the production compute node, then confirm the lease-healthy count recovers.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-tokenplace-production.md#tokenplacenohealthycomputenodes
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x6 1x4'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 5m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts:
          - exp_labels: {app: tokenplace, application: tokenplace, environment: prod, cluster: sugarkube-prod, namespace: tokenplace, release: tokenplace, severity: critical}
            exp_annotations:
              summary: token.place production has no healthy compute nodes
              description: The relay has explicitly reported zero lease-healthy compute nodes while its metrics target and instrumentation are healthy.
              remediation: Restore or re-register the production compute node, then confirm the lease-healthy count recovers.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-tokenplace-production.md#tokenplacenohealthycomputenodes
      - eval_time: 7m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'tokenplace_compute_nodes_healthy{app="wrong",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="staging",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="wrong",namespace="tokenplace",release="tokenplace"}'
        values: '0x10'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="wrong",release="tokenplace"}'
        values: '0x10'
      - series: 'tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="wrong"}'
        values: '0x10'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
      - series: 'tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: TokenplaceNoHealthyComputeNodes
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_ready{namespace="tokenplace",pod="tokenplace-0",container="relay"}'
        values: '1x15'
      - series: 'kube_pod_status_phase{namespace="tokenplace",pod="tokenplace-0",phase="Running"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts:
          - exp_labels: {application: tokenplace, cluster: sugarkube-prod, container: relay, environment: prod, instance: unknown, namespace: tokenplace, pod: tokenplace-0, severity: critical}
            exp_annotations:
              summary: Prometheus has no healthy token.place production metrics target
              description: The expected production relay is running but its authenticated ServiceMonitor target is down or missing; this does not prove compute capacity is zero.
              remediation: Check target discovery, the metrics Secret contract, and network access without reading the credential.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-tokenplace-production.md#tokenplacemetricstargetdown
  - interval: 1m
    input_series:
      - series: 'kube_pod_container_status_ready{namespace="tokenplace",pod="tokenplace-0",container="relay"}'
        values: '1x15'
      - series: 'kube_pod_status_phase{namespace="tokenplace",pod="tokenplace-0",phase="Running"}'
        values: '1x15'
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace",pod="tokenplace-0"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace",pod="tokenplace-0"}'
        values: '0x11 1x4'
    alert_rule_test:
      - eval_time: 10m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts:
          - exp_labels: {app: tokenplace, application: tokenplace, cluster: sugarkube-prod, environment: prod, namespace: tokenplace, pod: tokenplace-0, release: tokenplace, severity: critical}
            exp_annotations:
              summary: Prometheus has no healthy token.place production metrics target
              description: The expected production relay is running but its authenticated ServiceMonitor target is down or missing; this does not prove compute capacity is zero.
              remediation: Check target discovery, the metrics Secret contract, and network access without reading the credential.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-tokenplace-production.md#tokenplacemetricstargetdown
      - eval_time: 12m
        alertname: TokenplaceMetricsTargetDown
        exp_alerts: []
