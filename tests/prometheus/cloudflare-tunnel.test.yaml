rule_files:
  - cloudflare-tunnel-rules.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '4x20'
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '4x20'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '1x20'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: CloudflareTunnelNoHealthyConnections
        exp_alerts: []
      - eval_time: 15m
        alertname: CloudflareTunnelConnectionsDegraded
        exp_alerts: []
      - eval_time: 15m
        alertname: CloudflareTunnelMetricsTargetsDown
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '4x20'
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '2x20'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '1x20'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CloudflareTunnelConnectionsDegraded
        exp_alerts:
          - exp_labels: {}
  - interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '0x7 4x8'
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '0x7 4x8'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '1x20'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 6m
        alertname: CloudflareTunnelNoHealthyConnections
        exp_alerts:
          - exp_labels: {}
      - eval_time: 12m
        alertname: CloudflareTunnelNoHealthyConnections
        exp_alerts: []
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 6m
        alertname: CloudflareTunnelNoHealthyConnections
        exp_alerts:
          - exp_labels: {}
      - eval_time: 6m
        alertname: CloudflareTunnelMetricsTargetsDown
        exp_alerts:
          - exp_labels: {}
  - interval: 1m
    input_series:
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '4x3 0x3 4x12'
      - series: 'cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '4x3 0x3 4x12'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-a"}'
        values: '1x20'
      - series: 'up{namespace="cloudflare",service="cloudflare-tunnel-metrics",instance="connector-b"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: CloudflareTunnelNoHealthyConnections
        exp_alerts: []
      - eval_time: 12m
        alertname: CloudflareTunnelNoHealthyConnections
        exp_alerts: []
