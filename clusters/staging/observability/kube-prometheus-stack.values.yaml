prometheus:
  prometheusSpec:
    replicas: 1
    retention: 7d
    retentionSize: 15GB
    enableAdminAPI: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    externalLabels:
      cluster: sugarkube-int
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
