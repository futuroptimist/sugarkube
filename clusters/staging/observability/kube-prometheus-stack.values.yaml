# Staging-only non-Flux kube-prometheus-stack overrides.
# Production observability values are intentionally not codified yet.
prometheus:
  prometheusSpec:
    externalLabels:
      cluster: sugarkube-int
additionalPrometheusRulesMap:
  sugarkube-observability-watchdog:
    groups:
      - name: sugarkube-observability-watchdog
        interval: 1m
        rules:
          - alert: SugarkubeObservabilityWatchdog
            expr: vector(1)
            labels:
              environment: staging
              cluster: sugarkube-int
              purpose: observability-watchdog
            annotations:
              summary: Sugarkube staging observability watchdog
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-operations.md#observability-watchdog
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-pagerduty
      - alertmanager-healthchecks-watchdog
  config:
    route:
      group_by: null
      group_wait: null
      group_interval: null
      repeat_interval: null
      receiver: "null"
      routes:
        - receiver: pagerduty-dspace
          matchers:
            - alertname=~"^(DspaceBuildRevisionMismatch|DspaceMixedBuildRevisions|DspaceDeploymentImagePinMismatch|DspaceChatSyntheticFailed|DspaceMetricsTargetDown)$"
            - environment="staging"
            - cluster="sugarkube-int"
            - severity="critical"
        - receiver: pagerduty-synthetic-test
          matchers:
            - alertname="SugarkubePagerDutyTest"
            - environment="staging"
            - cluster="sugarkube-int"
            - severity="critical"
        - receiver: healthchecks-watchdog
          matchers:
            - alertname="SugarkubeObservabilityWatchdog"
            - environment="staging"
            - cluster="sugarkube-int"
            - purpose="observability-watchdog"
          group_by: [alertname, cluster, environment]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 5m
          continue: false
        - receiver: pagerduty-cloudflare-tunnel
          matchers:
            - alertname=~"^(CloudflareTunnelNoHealthyConnections|CloudflareTunnelMetricsTargetsDown)$"
            - environment="staging"
            - cluster="sugarkube-int"
            - severity="critical"
    receivers:
      - name: "null"
      - name: pagerduty-synthetic-test
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
      - name: pagerduty-dspace
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
      - name: healthchecks-watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks-watchdog/ping-url
            send_resolved: false
            max_alerts: 1
            timeout: 10s
      - name: pagerduty-cloudflare-tunnel
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
prometheus-node-exporter:
  extraArgs:
    - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
  extraHostVolumeMounts:
    - name: dspace-chat-textfile
      hostPath: /var/lib/node_exporter/textfile_collector
      mountPath: /var/lib/node_exporter/textfile_collector
      readOnly: true
