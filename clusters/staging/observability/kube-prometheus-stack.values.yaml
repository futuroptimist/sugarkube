# Staging-only non-Flux kube-prometheus-stack overrides.
# Production observability values are intentionally not codified yet.
prometheus:
  prometheusSpec:
    externalLabels:
      cluster: sugarkube-int
additionalPrometheusRulesMap:
  cloudflare-tunnel:
    groups:
      - name: cloudflare-tunnel
        rules:
          - alert: CloudflareTunnelNoHealthyConnections
            expr: (sum(cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics"}) or vector(0)) == 0
            for: 5m
            labels:
              environment: staging
              cluster: sugarkube-int
              severity: critical
            annotations:
              summary: No Cloudflare Tunnel edge connections
              description: Both staging connectors have reported zero healthy edge connections for five minutes.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/cloudflare_tunnel.md#wan-outage-recovery
          - alert: CloudflareTunnelConnectionsDegraded
            expr: (sum(cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics"}) or vector(0)) > 0 and (sum(cloudflared_tunnel_ha_connections{namespace="cloudflare",service="cloudflare-tunnel-metrics"}) or vector(0)) < 8
            for: 10m
            labels:
              environment: staging
              cluster: sugarkube-int
              severity: warning
            annotations:
              summary: Cloudflare Tunnel connections are degraded
              description: The two staging connectors have fewer than their expected eight aggregate HA connections.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/cloudflare_tunnel.md#wan-outage-recovery
          - alert: CloudflareTunnelMetricsTargetsDown
            expr: (sum(up{namespace="cloudflare",service="cloudflare-tunnel-metrics"} == 1) or vector(0)) < 2
            for: 5m
            labels:
              environment: staging
              cluster: sugarkube-int
              severity: critical
            annotations:
              summary: Cloudflare Tunnel metrics targets are missing or down
              description: Prometheus has scraped fewer than two healthy connector targets for five minutes.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/cloudflare_tunnel.md#wan-outage-recovery
  sugarkube-observability-watchdog:
    groups:
      - name: sugarkube-observability-watchdog
        interval: 1m
        rules:
          - alert: SugarkubeObservabilityWatchdog
            expr: vector(1)
            labels:
              environment: staging
              cluster: sugarkube-int
              purpose: observability-watchdog
            annotations:
              summary: Sugarkube staging observability watchdog
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-operations.md#observability-watchdog
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-pagerduty
      - alertmanager-healthchecks-watchdog
  config:
    route:
      group_by: null
      group_wait: null
      group_interval: null
      repeat_interval: null
      receiver: "null"
      routes:
        - receiver: pagerduty-dspace
          matchers:
            - alertname=~"^(DspaceBuildRevisionMismatch|DspaceMixedBuildRevisions|DspaceDeploymentImagePinMismatch|DspaceChatSyntheticFailed|DspaceMetricsTargetDown)$"
            - environment="staging"
            - cluster="sugarkube-int"
            - severity="critical"
        - receiver: pagerduty-synthetic-test
          matchers:
            - alertname="SugarkubePagerDutyTest"
            - environment="staging"
            - cluster="sugarkube-int"
            - severity="critical"
        - receiver: healthchecks-watchdog
          matchers:
            - alertname="SugarkubeObservabilityWatchdog"
            - environment="staging"
            - cluster="sugarkube-int"
            - purpose="observability-watchdog"
          group_by: [alertname, cluster, environment]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 5m
          continue: false
        - receiver: pagerduty-dspace
          matchers:
            - alertname=~"^(CloudflareTunnelNoHealthyConnections|CloudflareTunnelMetricsTargetsDown)$"
            - environment="staging"
            - cluster="sugarkube-int"
            - severity="critical"
    receivers:
      - name: "null"
      - name: pagerduty-synthetic-test
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
      - name: pagerduty-dspace
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
      - name: healthchecks-watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks-watchdog/ping-url
            send_resolved: false
            max_alerts: 1
            timeout: 10s
prometheus-node-exporter:
  extraArgs:
    - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
  extraHostVolumeMounts:
    - name: dspace-chat-textfile
      hostPath: /var/lib/node_exporter/textfile_collector
      mountPath: /var/lib/node_exporter/textfile_collector
      readOnly: true
