# Production-only non-Flux kube-prometheus-stack overrides.
defaultRules:
  disabled:
    Watchdog: true
prometheus:
  prometheusSpec:
    externalLabels:
      cluster: sugarkube-prod
additionalPrometheusRulesMap:
  sugarkube-observability-watchdog:
    groups:
      - name: sugarkube-observability-watchdog
        interval: 1m
        rules:
          - alert: SugarkubeObservabilityWatchdog
            expr: vector(1)
            labels:
              environment: prod
              cluster: sugarkube-prod
              purpose: observability-watchdog
            annotations:
              summary: Sugarkube production observability watchdog
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-operations.md#observability-watchdog
  tokenplace-production-capacity:
    groups:
      - name: tokenplace-production-capacity
        interval: 1m
        rules:
          - alert: TokenplaceNoHealthyComputeNodes
            expr: tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 0 and on (app, environment, cluster, namespace, release) up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 1 and on (app, environment, cluster, namespace, release) tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 1
            for: 5m
            labels:
              application: tokenplace
              environment: prod
              cluster: sugarkube-prod
              severity: critical
            annotations:
              summary: token.place production has no healthy compute nodes
              description: The relay has explicitly reported zero lease-healthy compute nodes while its metrics target and instrumentation are healthy.
              remediation: Restore or re-register the production compute node, then confirm the lease-healthy count recovers.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-tokenplace-production.md#tokenplacenohealthycomputenodes
          - alert: TokenplaceMetricsTargetDown
            expr: (up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 0) or label_replace(((kube_pod_container_status_ready{namespace="tokenplace",container="relay"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="tokenplace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="tokenplace"}) unless on (namespace, pod) up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}), "instance", "unknown", "", "")
            for: 10m
            labels:
              application: tokenplace
              environment: prod
              cluster: sugarkube-prod
              severity: critical
            annotations:
              summary: Prometheus has no healthy token.place production metrics target
              description: The expected production relay is running but its authenticated ServiceMonitor target is down or missing; this does not prove compute capacity is zero.
              remediation: Check target discovery, the metrics Secret contract, and network access without reading the credential.
              runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-tokenplace-production.md#tokenplacemetricstargetdown
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-pagerduty
      - alertmanager-healthchecks-watchdog
  config:
    route:
      group_by: null
      group_wait: null
      group_interval: null
      repeat_interval: null
      receiver: "null"
      routes:
        # token.place rules are below; the existing production rule sources remain separate.
        - receiver: pagerduty-tokenplace
          matchers:
            - alertname=~"^(TokenplaceNoHealthyComputeNodes|TokenplaceMetricsTargetDown)$"
            - application="tokenplace"
            - environment="prod"
            - cluster="sugarkube-prod"
            - severity="critical"
        - receiver: pagerduty-dspace
          matchers:
            - alertname=~"^(DspaceBuildRevisionMismatch|DspaceMixedBuildRevisions|DspaceDeploymentImagePinMismatch|DspaceChatSyntheticFailed|DspaceMetricsTargetDown)$"
            - environment="prod"
            - cluster="sugarkube-prod"
            - severity="critical"
        - receiver: pagerduty-dspace
          matchers:
            - alertname="CloudflareTunnelNoHealthyConnections"
            - environment="prod"
            - cluster="sugarkube-prod"
            - severity="critical"
        - receiver: pagerduty-synthetic-test
          matchers:
            - alertname="SugarkubePagerDutyTest"
            - environment="prod"
            - cluster="sugarkube-prod"
            - severity="critical"
        - receiver: healthchecks-watchdog
          matchers:
            - alertname="SugarkubeObservabilityWatchdog"
            - environment="prod"
            - cluster="sugarkube-prod"
            - purpose="observability-watchdog"
          group_by: [alertname, cluster, environment]
          group_wait: 30s
          group_interval: 1m
          repeat_interval: 5m
          continue: false
    receivers:
      - name: "null"
      - name: pagerduty-synthetic-test
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
      - name: pagerduty-dspace
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
      - name: pagerduty-tokenplace
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/alertmanager-pagerduty/routing-key
            send_resolved: true
      - name: healthchecks-watchdog
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks-watchdog/ping-url
            send_resolved: false
            max_alerts: 1
            timeout: 10s
