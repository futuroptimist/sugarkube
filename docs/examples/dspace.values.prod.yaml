# Example values for steady-state production (apex) deploys via Helm.
# The ingress host is democratized.space unless intentionally overridden.
environment: prod

ingress:
  enabled: true
  className: traefik
  host: democratized.space

env:
  - name: DSPACE_TOKEN_PLACE_URL
    value: https://token.place
  - name: DSPACE_TOKEN_PLACE_CHAT_MODEL
    value: llama-3.1-8b-instruct

metrics:
  enabled: true
  auth:
    existingSecret: dspace-prod-metrics-token
    secretKey: token

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  additionalLabels:
    release: kube-prometheus-stack
  cluster: sugarkube-prod
