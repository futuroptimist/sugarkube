# NOTE: Legacy/future Flux + Longhorn configuration only. The current live staging
# kube-prometheus-stack lifecycle is the guarded non-Flux Helm flow documented in
# docs/operations/observability-helm-staging.md. Do not apply this file to staging
# or production as currently written, and never combine it with the non-Flux Helm
# lifecycle for the same release.
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 58.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
