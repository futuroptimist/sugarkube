# LEGACY/FUTURE ONLY: inactive Flux/Longhorn observability design. Do not apply to staging or production as currently written; use the non-Flux Helm lifecycle in scripts/observability_helm.sh for the live staging kube-prometheus-stack release. Do not combine both lifecycle paths for the same release.
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 58.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
