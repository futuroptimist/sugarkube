# LEGACY / INACTIVE Flux design: do not apply to staging or production as currently written.
# The canonical live staging lifecycle is `just observability-* env=staging` with
# platform/observability/helm/ and clusters/staging/observability/ values.
# Do not combine Flux/Longhorn and non-Flux Helm lifecycles for this release.
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 58.2.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: kube-prometheus-stack-values
      valuesKey: values.yaml
