---
groups:
- name: application-slis
  interval: 1m
  rules:
  - record: sugarkube:sli_source_current
    expr: (count by (environment) ((kube_pod_container_status_ready{namespace="tokenplace",container="relay"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="tokenplace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="tokenplace"})) > 0) and on (environment) (min by (environment) (up{app="tokenplace",namespace="tokenplace",release="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(up{app="tokenplace",namespace="tokenplace",release="tokenplace"})) > time() - 60) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60) and on (environment) (count by (environment) ((kube_pod_container_status_ready{namespace="tokenplace",container="relay"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="tokenplace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="tokenplace"})) == count by (environment) ((kube_pod_container_status_ready{namespace="tokenplace",container="relay"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="tokenplace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="tokenplace"}) and on (environment, pod) (up{app="tokenplace",namespace="tokenplace",release="tokenplace"} == 1))) and on (environment) (count by (environment) ((kube_pod_container_status_ready{namespace="tokenplace",container="relay"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="tokenplace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="tokenplace"})) == count by (environment) ((kube_pod_container_status_ready{namespace="tokenplace",container="relay"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="tokenplace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="tokenplace"}) and on (environment, pod) (tokenplace_instrumentation_up{app="tokenplace"} == 1)))
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_source_history_complete
    expr: sugarkube:sli_source_current{application="token.place",sli="tokenplace-request-success"} and on (environment) (count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="tokenplace",container="relay"}[1h]) == 1)) == count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="tokenplace",container="relay"}[1h]) == 1) and on (environment, pod) (count_over_time(up{app="tokenplace",namespace="tokenplace",release="tokenplace"}[1h]) >= 120))) and on (environment) (count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="tokenplace",container="relay"}[1h]) == 1)) == count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="tokenplace",container="relay"}[1h]) == 1) and on (environment, pod) (count_over_time(tokenplace_instrumentation_up{app="tokenplace"}[1h]) >= 120))) and on (environment) (count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="tokenplace",container="relay"}[1h]) == 1)) == count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="tokenplace",container="relay"}[1h]) == 1) and on (environment, pod) (min by (environment, pod) (count_over_time(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) >= 120))) and on (environment) (sum by (environment) (resets(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0)
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_eligible_events:increase1h
    expr: (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h]))) and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0) and on (environment) sugarkube:sli_source_history_complete{application="token.place",sli="tokenplace-request-success"}
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_successful_events:increase1h
    expr: (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace",outcome="completed"}[1h])) or on (environment) (0 * (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0))) and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0) and on (environment) sugarkube:sli_source_history_complete{application="token.place",sli="tokenplace-request-success"}
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_observation_state
    expr: 0 * ((count by (environment) ((kube_pod_container_status_ready{namespace="tokenplace",container="relay"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="tokenplace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="tokenplace"})) > 0) unless on (environment) sugarkube:sli_source_current{application="token.place",sli="tokenplace-request-success"}) + 1
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
      observation_state: missing_or_stale_telemetry
  - record: sugarkube:sli_observation_state
    expr: 0 * (sugarkube:sli_source_current{application="token.place",sli="tokenplace-request-success"} unless on (environment) sugarkube:sli_source_history_complete{application="token.place",sli="tokenplace-request-success"}) + 1
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
      observation_state: reset_or_incomplete_history
  - record: sugarkube:sli_observation_state
    expr: 0 * (sugarkube:sli_source_history_complete{application="token.place",sli="tokenplace-request-success"} and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0)) + 1
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
      observation_state: no_eligible_traffic
  - record: sugarkube:sli_observation_state
    expr: 0 * ((sugarkube:sli_source_history_complete{application="token.place",sli="tokenplace-request-success"} and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0)) and on (environment) ((sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace",outcome="completed"}[1h])) or on (environment) (0 * (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0))) == on (environment) sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])))) + 1
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
      observation_state: successful_eligible_traffic
  - record: sugarkube:sli_observation_state
    expr: 0 * ((sugarkube:sli_source_history_complete{application="token.place",sli="tokenplace-request-success"} and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0)) and on (environment) ((sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace",outcome="completed"}[1h])) or on (environment) (0 * (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0))) < on (environment) sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])))) + 1
    labels:
      application: token.place
      sli: tokenplace-request-success
      signal_type: actual_request_success
      observation_state: failed_eligible_traffic
  - record: sugarkube:sli_source_current
    expr: (count by (environment) ((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"})) > 0) and on (environment) (min by (environment) (up{namespace="dspace",service=~"dspace.*"}) == 1) and on (environment) (min by (environment) (timestamp(up{namespace="dspace",service=~"dspace.*"})) > time() - 60) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60) and on (environment) (count by (environment) ((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"})) == count by (environment) ((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"}) and on (environment, pod) (up{namespace="dspace",service=~"dspace.*"} == 1))) and on (environment) (count by (environment) ((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"})) == count by (environment) ((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"}) and on (environment, pod) (dspace_instrumentation_up == 1)))
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_source_history_complete
    expr: sugarkube:sli_source_current{application="DSPACE",sli="dspace-chat-request-success"} and on (environment) (count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="dspace",container="dspace"}[1h]) == 1)) == count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="dspace",container="dspace"}[1h]) == 1) and on (environment, pod) (count_over_time(up{namespace="dspace",service=~"dspace.*"}[1h]) >= 120))) and on (environment) (count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="dspace",container="dspace"}[1h]) == 1)) == count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="dspace",container="dspace"}[1h]) == 1) and on (environment, pod) (count_over_time(dspace_instrumentation_up[1h]) >= 120))) and on (environment) (count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="dspace",container="dspace"}[1h]) == 1)) == count by (environment) ((max_over_time(kube_pod_container_status_ready{namespace="dspace",container="dspace"}[1h]) == 1) and on (environment, pod) (min by (environment, pod) (count_over_time(dspace_dchat_requests_total[1h])) >= 120))) and on (environment) (sum by (environment) (resets(dspace_dchat_requests_total[1h])) == 0)
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_eligible_events:increase1h
    expr: (sum by (environment) (increase(dspace_dchat_requests_total[1h]))) and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0) and on (environment) sugarkube:sli_source_history_complete{application="DSPACE",sli="dspace-chat-request-success"}
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_successful_events:increase1h
    expr: (sum by (environment) (increase(dspace_dchat_requests_total{outcome="success"}[1h])) or on (environment) (0 * (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0))) and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0) and on (environment) sugarkube:sli_source_history_complete{application="DSPACE",sli="dspace-chat-request-success"}
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
  - record: sugarkube:sli_observation_state
    expr: 0 * ((count by (environment) ((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"})) > 0) unless on (environment) sugarkube:sli_source_current{application="DSPACE",sli="dspace-chat-request-success"}) + 1
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
      observation_state: missing_or_stale_telemetry
  - record: sugarkube:sli_observation_state
    expr: 0 * (sugarkube:sli_source_current{application="DSPACE",sli="dspace-chat-request-success"} unless on (environment) sugarkube:sli_source_history_complete{application="DSPACE",sli="dspace-chat-request-success"}) + 1
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
      observation_state: reset_or_incomplete_history
  - record: sugarkube:sli_observation_state
    expr: 0 * (sugarkube:sli_source_history_complete{application="DSPACE",sli="dspace-chat-request-success"} and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) == 0)) + 1
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
      observation_state: no_eligible_traffic
  - record: sugarkube:sli_observation_state
    expr: 0 * ((sugarkube:sli_source_history_complete{application="DSPACE",sli="dspace-chat-request-success"} and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0)) and on (environment) ((sum by (environment) (increase(dspace_dchat_requests_total{outcome="success"}[1h])) or on (environment) (0 * (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0))) == on (environment) sum by (environment) (increase(dspace_dchat_requests_total[1h])))) + 1
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
      observation_state: successful_eligible_traffic
  - record: sugarkube:sli_observation_state
    expr: 0 * ((sugarkube:sli_source_history_complete{application="DSPACE",sli="dspace-chat-request-success"} and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0)) and on (environment) ((sum by (environment) (increase(dspace_dchat_requests_total{outcome="success"}[1h])) or on (environment) (0 * (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0))) < on (environment) sum by (environment) (increase(dspace_dchat_requests_total[1h])))) + 1
    labels:
      application: DSPACE
      sli: dspace-chat-request-success
      signal_type: actual_request_success
      observation_state: failed_eligible_traffic
  - record: sugarkube:sli_observation_state
    expr: 0 * max by (environment) (encrypted_completion_monitoring_enabled == 0) + 1
    labels:
      application: token.place
      sli: tokenplace-encrypted-completion
      signal_type: synthetic_completion
      observation_state: intentionally_disabled_monitoring
