---
groups:
  - name: application-slis
    interval: 1m
    rules:
      - record: sugarkube:sli_eligible_events:increase1h
        expr: |
          (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h]))) and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0) and on (environment) (((min by (environment) (tokenplace_instrumentation_up{app="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(tokenplace_instrumentation_up{app="tokenplace"}[1h])) >= 120) and on (environment) (sum by (environment) (resets(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0) and on (environment) (min by (environment) (count_over_time(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) >= 120)))
        labels:
          application: token.place
          sli: tokenplace-request-success
          signal_type: actual_request_success
      - record: sugarkube:sli_successful_events:increase1h
        expr: |
          ((sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace",outcome="completed"}[1h])) or on (environment) (0 * (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0)))) and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0) and on (environment) (((min by (environment) (tokenplace_instrumentation_up{app="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(tokenplace_instrumentation_up{app="tokenplace"}[1h])) >= 120) and on (environment) (sum by (environment) (resets(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0) and on (environment) (min by (environment) (count_over_time(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) >= 120)))
        labels:
          application: token.place
          sli: tokenplace-request-success
          signal_type: actual_request_success
      - record: sugarkube:sli_observation_state
        expr: |
          0 * ((max by (environment) (up{app="tokenplace"}) >= 0) unless on (environment) ((min by (environment) (tokenplace_instrumentation_up{app="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60))) + 1
        labels:
          application: token.place
          sli: tokenplace-request-success
          signal_type: actual_request_success
          observation_state: missing_or_stale_telemetry
      - record: sugarkube:sli_observation_state
        expr: |
          0 * (((min by (environment) (tokenplace_instrumentation_up{app="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60)) unless on (environment) ((min by (environment) (count_over_time(tokenplace_instrumentation_up{app="tokenplace"}[1h])) >= 120) and on (environment) (sum by (environment) (resets(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0) and on (environment) (min by (environment) (count_over_time(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) >= 120))) + 1
        labels:
          application: token.place
          sli: tokenplace-request-success
          signal_type: actual_request_success
          observation_state: reset_or_incomplete_history
      - record: sugarkube:sli_observation_state
        expr: |
          0 * ((((min by (environment) (tokenplace_instrumentation_up{app="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(tokenplace_instrumentation_up{app="tokenplace"}[1h])) >= 120) and on (environment) (sum by (environment) (resets(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0) and on (environment) (min by (environment) (count_over_time(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) >= 120))) and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0)) + 1
        labels:
          application: token.place
          sli: tokenplace-request-success
          signal_type: actual_request_success
          observation_state: no_eligible_traffic
      - record: sugarkube:sli_observation_state
        expr: |
          0 * (((((min by (environment) (tokenplace_instrumentation_up{app="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(tokenplace_instrumentation_up{app="tokenplace"}[1h])) >= 120) and on (environment) (sum by (environment) (resets(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0) and on (environment) (min by (environment) (count_over_time(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) >= 120))) and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0)) and on (environment) (((sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace",outcome="completed"}[1h])) or on (environment) (0 * (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0)))) == on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h]))))) + 1
        labels:
          application: token.place
          sli: tokenplace-request-success
          signal_type: actual_request_success
          observation_state: successful_eligible_traffic
      - record: sugarkube:sli_observation_state
        expr: |
          0 * (((((min by (environment) (tokenplace_instrumentation_up{app="tokenplace"}) == 1) and on (environment) (min by (environment) (timestamp(tokenplace_instrumentation_up{app="tokenplace"})) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(tokenplace_instrumentation_up{app="tokenplace"}[1h])) >= 120) and on (environment) (sum by (environment) (resets(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) == 0) and on (environment) (min by (environment) (count_over_time(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) >= 120))) and on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0)) and on (environment) (((sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace",outcome="completed"}[1h])) or on (environment) (0 * (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h])) > 0)))) < on (environment) (sum by (environment) (increase(tokenplace_relay_request_outcomes_total{app="tokenplace"}[1h]))))) + 1
        labels:
          application: token.place
          sli: tokenplace-request-success
          signal_type: actual_request_success
          observation_state: failed_eligible_traffic
      - record: sugarkube:sli_eligible_events:increase1h
        expr: |
          (sum by (environment) (increase(dspace_dchat_requests_total[1h]))) and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0) and on (environment) (((min by (environment) (dspace_instrumentation_up) == 1) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(dspace_instrumentation_up[1h])) >= 120) and on (environment) (sum by (environment) (resets(dspace_dchat_requests_total[1h])) == 0) and on (environment) (min by (environment) (count_over_time(dspace_dchat_requests_total[1h])) >= 120)))
        labels:
          application: DSPACE
          sli: dspace-chat-request-success
          signal_type: actual_request_success
      - record: sugarkube:sli_successful_events:increase1h
        expr: |
          ((sum by (environment) (increase(dspace_dchat_requests_total{outcome="success"}[1h])) or on (environment) (0 * (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0)))) and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0) and on (environment) (((min by (environment) (dspace_instrumentation_up) == 1) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(dspace_instrumentation_up[1h])) >= 120) and on (environment) (sum by (environment) (resets(dspace_dchat_requests_total[1h])) == 0) and on (environment) (min by (environment) (count_over_time(dspace_dchat_requests_total[1h])) >= 120)))
        labels:
          application: DSPACE
          sli: dspace-chat-request-success
          signal_type: actual_request_success
      - record: sugarkube:sli_observation_state
        expr: |
          0 * ((max by (environment) (up{namespace="dspace",service=~"dspace.*"}) >= 0) unless on (environment) ((min by (environment) (dspace_instrumentation_up) == 1) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60))) + 1
        labels:
          application: DSPACE
          sli: dspace-chat-request-success
          signal_type: actual_request_success
          observation_state: missing_or_stale_telemetry
      - record: sugarkube:sli_observation_state
        expr: |
          0 * (((min by (environment) (dspace_instrumentation_up) == 1) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60)) unless on (environment) ((min by (environment) (count_over_time(dspace_instrumentation_up[1h])) >= 120) and on (environment) (sum by (environment) (resets(dspace_dchat_requests_total[1h])) == 0) and on (environment) (min by (environment) (count_over_time(dspace_dchat_requests_total[1h])) >= 120))) + 1
        labels:
          application: DSPACE
          sli: dspace-chat-request-success
          signal_type: actual_request_success
          observation_state: reset_or_incomplete_history
      - record: sugarkube:sli_observation_state
        expr: |
          0 * ((((min by (environment) (dspace_instrumentation_up) == 1) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(dspace_instrumentation_up[1h])) >= 120) and on (environment) (sum by (environment) (resets(dspace_dchat_requests_total[1h])) == 0) and on (environment) (min by (environment) (count_over_time(dspace_dchat_requests_total[1h])) >= 120))) and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) == 0)) + 1
        labels:
          application: DSPACE
          sli: dspace-chat-request-success
          signal_type: actual_request_success
          observation_state: no_eligible_traffic
      - record: sugarkube:sli_observation_state
        expr: |
          0 * (((((min by (environment) (dspace_instrumentation_up) == 1) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(dspace_instrumentation_up[1h])) >= 120) and on (environment) (sum by (environment) (resets(dspace_dchat_requests_total[1h])) == 0) and on (environment) (min by (environment) (count_over_time(dspace_dchat_requests_total[1h])) >= 120))) and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0)) and on (environment) (((sum by (environment) (increase(dspace_dchat_requests_total{outcome="success"}[1h])) or on (environment) (0 * (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0)))) == on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h]))))) + 1
        labels:
          application: DSPACE
          sli: dspace-chat-request-success
          signal_type: actual_request_success
          observation_state: successful_eligible_traffic
      - record: sugarkube:sli_observation_state
        expr: |
          0 * (((((min by (environment) (dspace_instrumentation_up) == 1) and on (environment) (min by (environment) (timestamp(dspace_instrumentation_up)) > time() - 60)) and on (environment) ((min by (environment) (count_over_time(dspace_instrumentation_up[1h])) >= 120) and on (environment) (sum by (environment) (resets(dspace_dchat_requests_total[1h])) == 0) and on (environment) (min by (environment) (count_over_time(dspace_dchat_requests_total[1h])) >= 120))) and on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0)) and on (environment) (((sum by (environment) (increase(dspace_dchat_requests_total{outcome="success"}[1h])) or on (environment) (0 * (sum by (environment) (increase(dspace_dchat_requests_total[1h])) > 0)))) < on (environment) (sum by (environment) (increase(dspace_dchat_requests_total[1h]))))) + 1
        labels:
          application: DSPACE
          sli: dspace-chat-request-success
          signal_type: actual_request_success
          observation_state: failed_eligible_traffic
      - record: sugarkube:sli_observation_state
        expr: |
          0 * max by (environment) (encrypted_completion_monitoring_enabled == 0) + 1
        labels:
          application: token.place
          sli: tokenplace-encrypted-completion
          signal_type: synthetic_completion
          observation_state: intentionally_disabled_monitoring
