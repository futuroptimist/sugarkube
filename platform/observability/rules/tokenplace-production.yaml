---
groups:
  - name: tokenplace-production-capacity
    interval: 1m
    rules:
      - alert: TokenplaceNoHealthyComputeNodes
        expr: tokenplace_compute_nodes_healthy{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 0 and on (app, environment, cluster, namespace, release) tokenplace_instrumentation_up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 1 and on (app, environment, cluster, namespace, release) up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 1
        for: 5m
        labels:
          application: tokenplace
          environment: prod
          cluster: sugarkube-prod
          severity: critical
        annotations:
          summary: token.place production has no healthy compute nodes
          description: The relay has explicitly reported zero lease-healthy production compute nodes for five minutes while its instrumentation and Prometheus scrape remain healthy.
          remediation: Acknowledge the incident, restore and register the production compute node, then verify lease health and alert resolution.
          runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/k3s-tokenplace-prod.md#production-compute-capacity-alerts
      - alert: TokenplaceMetricsTargetDown
        expr: (up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"} == 0) or label_replace(((kube_pod_container_status_ready{namespace="tokenplace",container="relay",cluster="sugarkube-prod"} == 1 and on (namespace, pod, cluster) kube_pod_status_phase{namespace="tokenplace",phase="Running",cluster="sugarkube-prod"} == 1 unless on (namespace, pod, cluster) kube_pod_deletion_timestamp{namespace="tokenplace",cluster="sugarkube-prod"}) unless on (namespace, pod, cluster) up{app="tokenplace",environment="prod",cluster="sugarkube-prod",namespace="tokenplace",release="tokenplace"}), "instance", "unknown", "", "")
        for: 10m
        labels:
          application: tokenplace
          environment: prod
          cluster: sugarkube-prod
          severity: critical
        annotations:
          summary: Prometheus has no healthy token.place production metrics target
          description: The expected production relay is running but its authenticated metrics target is down or missing; this does not prove compute capacity is zero.
          remediation: Check ServiceMonitor discovery, the metrics Secret contract, authentication, and network reachability before diagnosing compute capacity.
          runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/k3s-tokenplace-prod.md#production-compute-capacity-alerts
