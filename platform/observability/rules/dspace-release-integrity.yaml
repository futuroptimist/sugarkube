---
groups:
- name: dspace-release-integrity
  interval: 1m
  rules:
  - record: dspace_release_approved_info
    expr: vector(1)
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      revision: '018687f5a7f4de45508c6e36eb28afb3e44da24d'
      image: main-018687f
      image_digest: sha256:2b95b7fdccdd011553c8d8617e3090ee27323996c532148fdb147cb9fd6e1b6c
      evidence: deployment-evidence/dspace/staging/main-018687f-20260805T035722Z.json
  - alert: DspaceBuildRevisionMismatch
    expr: (max by (revision) (dspace_build_info{environment="staging"}) unless on
      (revision) dspace_release_approved_info{environment="staging"}) or label_replace(absent(dspace_build_info{environment="staging"}),
      "revision", "unknown", "", "")
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '018687f5a7f4de45508c6e36eb28afb3e44da24d'
    annotations:
      summary: DSPACE runtime revision differs from the approved release
      description: Runtime revision {{ $labels.revision }} is not approved; reconcile
        the immutable release coordinates.
      current_revision: "{{ $labels.revision }}"
      remediation: Roll back or redeploy the finalized evidence coordinates, then
        verify every pod identity.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacebuildrevisionmismatch
  - alert: DspaceMixedBuildRevisions
    expr: count(count by (revision) (dspace_build_info{environment="staging"})) >
      1
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '018687f5a7f4de45508c6e36eb28afb3e44da24d'
    annotations:
      summary: DSPACE replicas report mixed build revisions
      description: More than one active revision persisted beyond the rollout settling
        window.
      current_revision: multiple
      remediation: Pause the rollout; inspect ReplicaSets and converge all ready pods
        on the approved revision.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacemixedbuildrevisions
  - alert: DspaceDeploymentImagePinMismatch
    expr: max by (image_id) (kube_pod_container_info{namespace="dspace",container="dspace",image_id!="docker-pullable://ghcr.io/democratizedspace/dspace@sha256:2b95b7fdccdd011553c8d8617e3090ee27323996c532148fdb147cb9fd6e1b6c"})
      > 0
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '018687f5a7f4de45508c6e36eb28afb3e44da24d'
    annotations:
      summary: DSPACE active pod image does not match the approved digest
      description: An active DSPACE container has an unapproved immutable image digest.
      current_revision: unknown
      remediation: Compare the Deployment template and pod imageID, then restore the
        evidence-approved digest.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacedeploymentimagepinmismatch
  - alert: DspaceChatSyntheticFailed
    expr: (dspace_chat_synthetic_success{application="dspace",environment="staging"}
      == 0) or (time() - dspace_chat_synthetic_timestamp_seconds{application="dspace",environment="staging"}
      > 900) or absent(dspace_chat_synthetic_timestamp_seconds{application="dspace",environment="staging"})
    for: 5m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '018687f5a7f4de45508c6e36eb28afb3e44da24d'
    annotations:
      summary: DSPACE isolated /chat synthetic failed, is stale, or is missing
      description: A zero success value is an executed failure; timestamp age or absence
        is a fail-closed producer failure.
      current_revision: unknown
      remediation: Inspect producer freshness first, then verify public /chat and
        the configured provider without exposing keys.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacechatsyntheticfailed
  - alert: DspaceMetricsTargetDown
    expr: (max(up{namespace="dspace",service=~"dspace.*"}) == 0) or absent(up{namespace="dspace",service=~"dspace.*"})
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '018687f5a7f4de45508c6e36eb28afb3e44da24d'
    annotations:
      summary: Prometheus has no healthy DSPACE metrics target
      description: The DSPACE ServiceMonitor target is down or missing; this does
        not by itself prove the application is down.
      current_revision: unknown
      remediation: Check target discovery, bearer Secret wiring, and network policy
        before diagnosing the application.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacemetricstargetdown
