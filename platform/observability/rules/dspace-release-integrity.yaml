---
groups:
- name: dspace-release-integrity
  interval: 1m
  rules:
  - record: dspace_release_approved_info
    expr: vector(1)
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      revision: '22f506e07e0b5abfd0cf756e9c5827c0458fb4b2'
      image: main-22f506e
      image_digest: sha256:467890df969cc7938cb760f965fd8f90a8912b1dcb1f8425bc808216b7e1512b
      evidence: deployment-evidence/dspace/staging/main-22f506e-20260817T094911Z.json
  - alert: DspaceBuildRevisionMismatch
    expr: (max by (revision) (dspace_build_info{environment="staging"} and on (namespace, pod) (kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"})) unless on (revision) dspace_release_approved_info{environment="staging"}) or label_replace(((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"}) unless on (namespace, pod) dspace_build_info{environment="staging"}), "revision", "unknown", "", "")
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '22f506e07e0b5abfd0cf756e9c5827c0458fb4b2'
    annotations:
      summary: DSPACE runtime revision differs from the approved release
      description: Runtime revision {{ $labels.revision }} is not approved; reconcile the immutable release coordinates.
      current_revision: "{{ $labels.revision }}"
      remediation: Roll back or redeploy the finalized evidence coordinates, then verify every pod identity.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacebuildrevisionmismatch
  - alert: DspaceMixedBuildRevisions
    expr: count(count by (revision) (dspace_build_info{environment="staging"} and on (namespace, pod) (kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"}))) > 1
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '22f506e07e0b5abfd0cf756e9c5827c0458fb4b2'
    annotations:
      summary: DSPACE replicas report mixed build revisions
      description: More than one active revision persisted beyond the rollout settling window.
      current_revision: multiple
      remediation: Pause the rollout; inspect ReplicaSets and converge all ready pods on the approved revision.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacemixedbuildrevisions
  - alert: DspaceDeploymentImagePinMismatch
    expr: max by (pod, image_id, image_spec) ((kube_pod_container_info{namespace="dspace",container="dspace"} unless on (namespace, pod, container) kube_pod_container_info{namespace="dspace",container="dspace",image_id=~"^(docker-pullable://)?ghcr.io/democratizedspace/dspace@sha256:467890df969cc7938cb760f965fd8f90a8912b1dcb1f8425bc808216b7e1512b$",image_spec="ghcr.io/democratizedspace/dspace:main-22f506e"}) and on (namespace, pod, container) (kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"})) or label_replace(label_replace((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"}) unless on (namespace, pod, container) kube_pod_container_info{namespace="dspace",container="dspace"}, "image_id", "unknown", "", ""), "image_spec", "unknown", "", "")
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '22f506e07e0b5abfd0cf756e9c5827c0458fb4b2'
    annotations:
      summary: DSPACE active pod image does not match the approved digest
      description: An active DSPACE container has an unapproved immutable image digest.
      current_revision: unknown
      remediation: Compare the Deployment template and pod imageID, then restore the evidence-approved digest.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacedeploymentimagepinmismatch
  - alert: DspaceChatSyntheticFailed
    expr: label_replace(dspace_chat_synthetic_success{application="dspace",environment="staging"} == 0, "state", "executed_failure", "", "") or label_replace(time() - dspace_chat_synthetic_timestamp_seconds{application="dspace",environment="staging"} > 900, "state", "stale", "", "") or label_replace(absent(dspace_chat_synthetic_success{application="dspace",environment="staging"}) or absent(dspace_chat_synthetic_timestamp_seconds{application="dspace",environment="staging"}), "state", "missing", "", "")
    for: 5m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '22f506e07e0b5abfd0cf756e9c5827c0458fb4b2'
    annotations:
      summary: DSPACE isolated /chat synthetic failed, is stale, or is missing
      description: A zero success value is an executed failure; timestamp age or absence is a fail-closed producer failure.
      current_revision: unknown
      remediation: Inspect producer freshness first, then verify public /chat and the configured provider without exposing keys.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacechatsyntheticfailed
  - alert: DspaceMetricsTargetDown
    expr: (up{namespace="dspace",service=~"dspace.*"} == 0) or label_replace(((kube_pod_container_status_ready{namespace="dspace",container="dspace"} == 1 and on (namespace, pod) kube_pod_status_phase{namespace="dspace",phase="Running"} == 1 unless on (namespace, pod) kube_pod_deletion_timestamp{namespace="dspace"}) unless on (namespace, pod) up{namespace="dspace",service=~"dspace.*"}), "instance", "unknown", "", "")
    for: 10m
    labels:
      application: dspace
      environment: staging
      cluster: sugarkube-int
      severity: critical
      expected_revision: '22f506e07e0b5abfd0cf756e9c5827c0458fb4b2'
    annotations:
      summary: Prometheus has no healthy DSPACE metrics target
      description: The DSPACE ServiceMonitor target is down or missing; this does not by itself prove the application is down.
      current_revision: unknown
      remediation: Check target discovery, bearer Secret wiring, and network policy before diagnosing the application.
      runbook_url: https://github.com/futuroptimist/sugarkube/blob/main/docs/observability-dspace-release-integrity.md#dspacemetricstargetdown
