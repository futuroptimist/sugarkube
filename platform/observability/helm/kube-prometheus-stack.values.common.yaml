# Common non-Flux kube-prometheus-stack values for Sugarkube.
# Canonical live staging lifecycle: scripts/observability_helm.sh via just observability-*.
# Do not combine these Helm values with the legacy Flux/Longhorn manifests in platform/observability/*.yaml.
fullnameOverride: kube-prometheus-stack
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    retention: 90d
    retentionSize: 100GB
    enableAdminAPI: false
    serviceMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    podMonitorSelector:
      matchLabels:
        release: kube-prometheus-stack
    probeSelector:
      matchLabels:
        release: kube-prometheus-stack
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 128Gi
grafana:
  # Prepared for a dedicated rendering host; keep disabled on the 8 GiB Pi nodes.
  imageRenderer:
    enabled: false
    image:
      tag: "5.12.5"
      pullPolicy: IfNotPresent
    healthcheckPath: /healthz
    existingSecret: grafana-renderer-auth
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
      limits:
        memory: 16Gi
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  ingress:
    enabled: false
  service:
    type: NodePort
    nodePort: 30300
  serviceMonitor:
    selfMonitor: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: sugarkube
          orgId: 1
          folder: Sugarkube
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/sugarkube
alertmanager:
  service:
    type: ClusterIP
  alertmanagerSpec:
    replicas: 1
  config:
    route:
      receiver: "null"
    receivers:
      - name: "null"
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
