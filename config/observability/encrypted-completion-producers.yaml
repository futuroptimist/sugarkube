version: 1
producers:
- application: tokenplace
  environment: staging
  producer: tokenplace-encrypted-completion
  enabled: false
  cadence: 15m
  timeout: 2m
  concurrency: 1
  bucket: inference
  limits:
    hourly: 10
    daily: 100
  route: /api/v1/chat/completions
  method: POST
  exemptions: []
  safety_margin: 0.2
  unlimited_operational: false
  failure_stages:
  - timeout
  - compute_unavailable
  - malformed_completion
  - interrupted
  - decryption_failed
